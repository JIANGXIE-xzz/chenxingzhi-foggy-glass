<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080c11">
<title>雨滴玻璃效果-陈星知制作</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.min.js"></script>

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}

  :root{
    --ink-1:#eef3f9;
    --ink-2:#bccbdb;
    --ink-3:#8397ab;
    --ink-4:#56697e;
    --ink-5:#38495c;
    --accent:#9bb6d0;
    --accent-2:#b6cbdf;
    --card-top:rgba(218,232,245,.075);
    --card-bot:rgba(218,232,245,.012);
    --card-border:rgba(214,230,246,.09);
    --glass-tint:rgba(20, 30, 44, .48);
    --radius-card:24px;
    --radius-input:14px;
    --radius-pill:13px;
    --shadow-card:
      0 2px 4px -2px rgba(0,0,0,.4),
      0 24px 60px -28px rgba(0,0,0,.9),
      0 1px 0 rgba(0,0,0,.4),
      inset 0 1px 0 rgba(255,255,255,.09),
      inset 0 -1px 0 rgba(255,255,255,.018);
    --shadow-btn:
      0 1px 0 rgba(255,255,255,.28) inset,
      0 0 0 1px rgba(255,255,255,.10) inset,
      0 10px 24px -12px rgba(120,160,200,.75),
      0 2px 6px -2px rgba(0,0,0,.5);
  }

  body{
    font-family:"Outfit",-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    font-weight:400;
    font-feature-settings:"ss01","cv01","tnum";
    letter-spacing:.004em;
    background:#080c11;
    color:var(--ink-1);
    overflow-x:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }

  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(140% 70% at 50% -10%, #2f3a47 0%, #171e27 42%, #0a0f15 72%, #05080b 100%),
      radial-gradient(60% 40% at 12% 6%, rgba(150,180,215,.10), transparent 68%),
      radial-gradient(55% 36% at 88% 88%, rgba(110,140,180,.085), transparent 70%);
    background-attachment:fixed;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:2;
    opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .app{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:18px 16px 56px;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:4px 2px 26px;
    border-bottom:1px solid rgba(214,230,246,.055);
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;align-items:center;gap:13px;
    font-family:"Playfair Display","Noto Serif SC",Georgia,serif;
    font-weight:600;font-size:18px;letter-spacing:.008em;
    color:#f2f6fb;font-style:italic;
  }
  .brand-dot{
    width:14px;height:14px;border-radius:50%;flex:0 0 14px;
    background:radial-gradient(circle at 32% 26%, #ffffff 0%, #d3e3f0 22%, #93b2cf 55%, #4d6784 100%);
    box-shadow:0 0 20px rgba(150,185,220,.75), 0 0 6px rgba(255,255,255,.55),
      inset 0 0 3px rgba(255,255,255,.9), inset 0 -1px 2px rgba(30,55,85,.55);
    position:relative;
  }
  .brand-dot::after{
    content:"";position:absolute;inset:-8px;border-radius:50%;
    border:1px solid rgba(160,190,220,.28);
    animation:brandPulse 4s ease-in-out infinite;
  }
  @keyframes brandPulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.10;transform:scale(1.30)}}
  .brand small{
    display:block;font-family:"Outfit",sans-serif;font-style:normal;
    font-size:9px;font-weight:500;letter-spacing:.24em;
    color:var(--ink-4);text-transform:uppercase;margin-top:3px;
  }
  .top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

  .btn{
    position:relative;overflow:hidden;
    border:0;cursor:pointer;font-family:inherit;
    font-weight:600;font-size:13.5px;letter-spacing:.04em;
    border-radius:var(--radius-pill);padding:12px 22px;color:#fff;
    background:linear-gradient(180deg, #a3bed6 0%, #6c8aa8 42%, #4a6382 100%);
    box-shadow:var(--shadow-btn);
    transition:transform .18s cubic-bezier(.3,.9,.4,1.1), box-shadow .28s ease, filter .2s ease;
  }
  .btn::before{
    content:"";position:absolute;top:0;left:0;right:0;height:45%;
    background:linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0));
    border-radius:var(--radius-pill) var(--radius-pill) 0 0;
    pointer-events:none;
  }
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:translateY(1px) scale(.985)}
  .btn[disabled]{opacity:.36;cursor:not-allowed;filter:grayscale(.3)}
  .btn.ghost{
    background:linear-gradient(180deg, rgba(218,232,245,.08), rgba(218,232,245,.03));
    color:var(--ink-2);
    box-shadow:inset 0 0 0 1px rgba(214,230,246,.12);
  }
  .btn.ghost:hover{color:#fff;background:linear-gradient(180deg, rgba(218,232,245,.14), rgba(218,232,245,.06));}

  .layout{display:flex;flex-direction:column;gap:24px;}
  .preview-col{display:flex;flex-direction:column;align-items:center;gap:14px;}

  .stage-wrap{
    display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;
  }
  .ratio-tabs{
    display:flex;gap:6px;padding:4px;
    background:linear-gradient(180deg, rgba(218,232,245,.05), rgba(218,232,245,.015));
    border:1px solid rgba(214,230,246,.08);
    border-radius:14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  }
  .ratio-tab{
    padding:8px 18px;border-radius:10px;cursor:pointer;font-family:inherit;
    font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--ink-3);
    background:transparent;border:0;
    transition:background .2s, color .2s, box-shadow .2s;
  }
  .ratio-tab:hover{color:var(--ink-1);}
  .ratio-tab.active{
    background:linear-gradient(180deg, rgba(160,192,218,.22), rgba(120,158,192,.12));
    color:#fff;
    box-shadow:0 0 0 1px rgba(180,208,232,.45), inset 0 1px 0 rgba(255,255,255,.20);
  }

  .stage{
    position:relative;
    border-radius:26px;
    overflow:hidden;
    background:#06090d;
    isolation:isolate;
    box-shadow:
      0 2px 4px -2px rgba(0,0,0,.5),
      0 50px 100px -30px rgba(0,0,0,.98),
      0 0 0 1px rgba(210,226,240,.075),
      inset 0 1px 0 rgba(255,255,255,.13),
      0 0 90px -14px rgba(140,180,220,.20);
    transition:aspect-ratio .4s cubic-bezier(.3,.9,.4,1.1), width .4s cubic-bezier(.3,.9,.4,1.1);
  }
  .stage[data-ratio="1:1"]{
    width:min(100%, 60vh);
    aspect-ratio:1 / 1;
  }
  .stage[data-ratio="9:16"]{
    width:min(100%, 62vh * 9 / 16);
    aspect-ratio:9 / 16;
  }
  .stage::before{
    content:"";position:absolute;inset:11px;border-radius:16px;
    border:1px solid rgba(210,226,240,.055);
    pointer-events:none;z-index:6;
  }
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;}

  .hint{
    margin:0;font-family:"Outfit",sans-serif;
    font-size:10.5px;font-weight:400;letter-spacing:.28em;
    text-transform:uppercase;color:var(--ink-4);
  }
  .hint b{color:var(--accent-2);font-weight:500}

  .panel{display:flex;flex-direction:column;gap:16px;}

  .card{
    position:relative;
    padding:22px 20px 20px;
    border-radius:var(--radius-card);
    background:linear-gradient(180deg, var(--card-top), var(--card-bot)), var(--glass-tint);
    border:1px solid var(--card-border);
    backdrop-filter: blur(26px) saturate(160%);
    -webkit-backdrop-filter: blur(26px) saturate(160%);
    box-shadow:var(--shadow-card);
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:16%;right:16%;height:1px;
    background:linear-gradient(90deg, transparent 0%, rgba(200,222,240,.45) 30%, rgba(230,240,250,.75) 50%, rgba(200,222,240,.45) 70%, transparent 100%);
  }
  .card::after{
    content:"";position:absolute;top:-55%;right:-35%;width:80%;height:90%;
    background:radial-gradient(circle at 68% 32%, rgba(160,190,220,.09), transparent 62%);
    pointer-events:none;
  }

  .card-title{
    display:flex;align-items:center;gap:10px;
    font-family:"Outfit",sans-serif;
    font-size:10px;font-weight:600;letter-spacing:.30em;
    text-transform:uppercase;color:var(--ink-3);
    margin-bottom:18px;
  }
  .card-title::before{
    content:"";width:6px;height:6px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #dfebf5 0%, #b5cadf 55%, #7f9bb5 100%);
    box-shadow:0 0 10px rgba(150,185,215,.9);
  }

  .field{display:flex;flex-direction:column;gap:9px;margin-top:15px;}
  .field:first-of-type{margin-top:0;}
  .field > span{
    font-size:11px;color:var(--ink-3);font-weight:400;letter-spacing:.09em;
    display:flex;align-items:center;justify-content:space-between;
    text-transform:uppercase;
  }
  .field > span b{
    font-family:"Outfit",sans-serif;
    font-weight:500;color:var(--accent-2);
    font-variant-numeric:tabular-nums;font-size:12.5px;
    letter-spacing:.02em;text-transform:none;
  }
  .field.row{flex-direction:row;align-items:center;justify-content:space-between;}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:28px;background:transparent;outline:none;cursor:pointer;
    padding:0;margin:0;display:block;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:6px;border-radius:3px;
    background:linear-gradient(90deg,
      rgba(190,215,235,.95) 0%, rgba(200,222,240,.90) var(--progress, 50%),
      rgba(255,255,255,.055) var(--progress, 50%), rgba(255,255,255,.055) 100%);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.045), 0 0 0 1px rgba(0,0,0,.28);
  }
  input[type=range]::-moz-range-track{
    height:6px;border-radius:3px;
    background:linear-gradient(90deg,
      rgba(190,215,235,.95) 0%, rgba(200,222,240,.90) var(--progress, 50%),
      rgba(255,255,255,.055) var(--progress, 50%), rgba(255,255,255,.055) 100%);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.55);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:22px;height:22px;border-radius:50%;margin-top:-8px;
    background:radial-gradient(circle at 32% 28%, #ffffff 0%, #eaf1f8 30%, #c6d8e8 62%, #93aec5 100%);
    border:1px solid rgba(255,255,255,.92);
    box-shadow:0 5px 12px rgba(0,0,0,.55), 0 0 0 4px rgba(150,185,215,.14), 0 0 24px -4px rgba(150,185,215,.6), inset 0 -1.5px 2.5px rgba(30,60,90,.30);
    transition:transform .18s cubic-bezier(.3,.9,.4,1.2);
  }
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.14);}
  input[type=range]::-moz-range-thumb{
    width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #ffffff 0%, #eaf1f8 30%, #c6d8e8 62%, #93aec5 100%);
    border:1px solid rgba(255,255,255,.92);
    box-shadow:0 5px 12px rgba(0,0,0,.55), 0 0 0 4px rgba(150,185,215,.14);
    cursor:pointer;
  }

  input[type=color]{
    -webkit-appearance:none;appearance:none;
    width:60px;height:40px;padding:0;
    border:1px solid rgba(214,230,246,.16);
    border-radius:12px;background:transparent;cursor:pointer;overflow:hidden;
    box-shadow:0 4px 14px -5px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.10);
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:3px;}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:8px}
  input[type=color]::-moz-color-swatch{border:none;border-radius:8px}

  .swatches{display:flex;gap:12px;flex-wrap:wrap;}
  .swatch{
    position:relative;
    width:38px;height:38px;border-radius:50%;padding:0;cursor:pointer;
    border:1.5px solid rgba(214,230,246,.14);
    transition:transform .22s cubic-bezier(.3,.9,.4,1.3), border-color .22s, box-shadow .22s;
    box-shadow:0 4px 12px -5px rgba(0,0,0,.55), inset 0 1px 2px rgba(255,255,255,.38), inset 0 -1px 2px rgba(0,0,0,.25);
  }
  .swatch::after{
    content:"";position:absolute;inset:-5px;border-radius:50%;
    border:1px solid transparent;transition:border-color .22s;
  }
  .swatch.active{
    border-color:#fff;transform:scale(1.10);
    box-shadow:0 8px 20px -6px rgba(0,0,0,.7), 0 0 0 3px rgba(255,255,255,.08);
  }
  .swatch.active::after{border-color:rgba(255,255,255,.32)}

  .upload-row{display:flex;gap:10px;flex-wrap:wrap;}
  .upload-btn{
    flex:1 1 88px;min-width:88px;height:48px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    border-radius:var(--radius-pill);cursor:pointer;user-select:none;
    background:linear-gradient(180deg, rgba(218,232,245,.07), rgba(218,232,245,.028));
    border:1px solid rgba(214,230,246,.10);
    font-family:inherit;font-size:12.5px;font-weight:500;letter-spacing:.05em;
    color:var(--ink-2);text-transform:uppercase;
    transition:background .2s, transform .18s, border-color .2s, color .2s;
  }
  .upload-btn:hover{border-color:rgba(180,208,230,.30);color:#fff;}
  .upload-btn:active{transform:scale(.985);}
  .upload-btn.ghost{color:var(--ink-3);flex:0 0 auto;padding:0 18px;background:transparent;box-shadow:inset 0 0 0 1px rgba(214,230,246,.09);}

  .upload-status{
    display:flex;align-items:center;gap:7px;
    font-size:11px;color:var(--ink-4);margin-top:11px;letter-spacing:.05em;
    min-height:15px;text-transform:uppercase;font-weight:400;
  }
  .upload-status.ok{color:var(--accent-2)}
  .upload-status.err{color:#e9a8a8}
  .upload-status::before{
    content:"";width:5px;height:5px;border-radius:50%;
    background:currentColor;opacity:.65;flex:0 0 5px;
    box-shadow:0 0 6px currentColor;
  }

  .modal{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    padding:18px;
    background:rgba(4,7,11,.78);
    backdrop-filter:blur(24px) saturate(140%);
    -webkit-backdrop-filter:blur(24px) saturate(140%);
    opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  .modal.open{opacity:1;pointer-events:auto;}
  .modal-card{
    position:relative;
    width:min(520px,100%);
    max-height:90vh;overflow-y:auto;overscroll-behavior:contain;
    padding:26px 24px 24px;
    border-radius:30px;
    background:linear-gradient(158deg, rgba(218,232,245,.16), rgba(218,232,245,.035) 45%, rgba(218,232,245,.07)), rgba(20, 30, 44, .62);
    border:1px solid rgba(214,230,246,.20);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    box-shadow:0 2px 4px -2px rgba(0,0,0,.5), 0 60px 120px -24px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.55);
    transform:translateY(18px) scale(.965);
    transition:transform .34s cubic-bezier(.2,.9,.3,1.1);
  }
  .modal.open .modal-card{transform:none;}

  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .modal-head h3{
    margin:0;
    font-family:"Playfair Display","Noto Serif SC",Georgia,serif;
    font-weight:600;font-size:21px;color:#f4f8fb;font-style:italic;
  }
  .icon-btn{
    width:36px;height:36px;border-radius:50%;
    border:1px solid rgba(214,230,246,.16);
    background:rgba(214,230,246,.06);color:var(--ink-2);
    font-size:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s, transform .16s;
  }
  .icon-btn:active{background:rgba(214,230,246,.22);transform:scale(.94)}

  .fmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .fmt-btn{
    display:flex;flex-direction:column;gap:3px;align-items:flex-start;
    padding:14px 14px;border-radius:16px;cursor:pointer;font-family:inherit;
    background:linear-gradient(180deg, rgba(218,232,245,.06), rgba(218,232,245,.018));
    border:1px solid rgba(214,230,246,.11);
    color:#e6eefc;text-align:left;
    transition:background .2s, border-color .2s, transform .16s, box-shadow .2s;
  }
  .fmt-btn b{
    font-family:"Playfair Display","Noto Serif SC",Georgia,serif;
    font-size:15px;font-weight:600;color:#f0f6fb;
  }
  .fmt-btn span{font-size:9.5px;color:var(--ink-3);letter-spacing:.10em;font-weight:400;text-transform:uppercase;}
  .fmt-btn:active{transform:scale(.975);}
  .fmt-btn.active{
    background:linear-gradient(180deg, rgba(160,192,218,.24), rgba(120,158,192,.14));
    border-color:rgba(180,208,232,.68);
    box-shadow:0 0 0 3px rgba(150,185,215,.11), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .fmt-btn.active b{color:#fff}

  .res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .res-btn{
    padding:11px 10px;border-radius:13px;cursor:pointer;font-family:inherit;
    background:linear-gradient(180deg, rgba(218,232,245,.06), rgba(218,232,245,.018));
    border:1px solid rgba(214,230,246,.11);
    color:#e6eefc;text-align:center;font-size:12px;font-weight:500;
    transition:background .2s, border-color .2s;
  }
  .res-btn.active{
    background:linear-gradient(180deg, rgba(160,192,218,.24), rgba(120,158,192,.14));
    border-color:rgba(180,208,232,.68);
    color:#fff;
  }

  .dur-row{display:flex;gap:8px;margin-bottom:16px;}
  .dur-btn{
    flex:1;padding:10px;border-radius:12px;cursor:pointer;font-family:inherit;
    background:linear-gradient(180deg, rgba(218,232,245,.06), rgba(218,232,245,.018));
    border:1px solid rgba(214,230,246,.11);
    color:var(--ink-2);text-align:center;font-size:12px;font-weight:500;
    transition:background .2s, border-color .2s, color .2s;
  }
  .dur-btn.active{
    background:linear-gradient(180deg, rgba(160,192,218,.24), rgba(120,158,192,.14));
    border-color:rgba(180,208,232,.68);
    color:#fff;
  }

  .progress-wrap{
    margin:14px 0;padding:14px 16px;border-radius:16px;
    background:linear-gradient(180deg, rgba(218,232,245,.05), rgba(218,232,245,.015));
    border:1px solid rgba(214,230,246,.09);
    display:none;
  }
  .progress-wrap.show{display:block;}
  .progress-label{
    font-size:11px;color:var(--ink-3);letter-spacing:.1em;
    text-transform:uppercase;margin-bottom:10px;
    display:flex;justify-content:space-between;
  }
  .progress-label b{color:var(--accent-2);font-weight:500;}
  .progress-bar{
    height:6px;border-radius:3px;overflow:hidden;
    background:rgba(255,255,255,.06);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.5);
  }
  .progress-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, #a3bed6, #6c8aa8);
    border-radius:3px;
    transition:width .2s ease;
    box-shadow:0 0 12px rgba(150,185,215,.5);
  }

  .preview-wrap{
    position:relative;margin-bottom:16px;border-radius:20px;overflow:hidden;
    border:1px solid rgba(214,230,246,.16);
    box-shadow:0 24px 50px -22px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.45);
    background-color:#131820;
    background-image:
      linear-gradient(45deg, rgba(218,232,245,.05) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(218,232,245,.05) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(218,232,245,.05) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(218,232,245,.05) 75%);
    background-size:18px 18px;

</style>
</head>
<body>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function hexToRgb01(hex){
  let h = (hex || '#8ba8c4').replace('#','');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255];
}
const mixRGB = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);

const state = {
  ratio: '1:1',
  color: '#8ba8c4',
  speed: 1.0,
  refract: 0.08,
  fog: 0.35,
  wallDim: 0.25,
  density: 1.2,
  trail: 0.50,
  wallSource: null,
  wallSourceOriginal: null, // 保存原始图片用于比例切换时重新处理
  hasTex: false
};

const glCanvas = $('#gl');
const stage = $('#stage');

const VERT = `
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const FRAG = `
precision highp float;

uniform vec2  uRes;
uniform float uTime;
uniform vec3  uColorA;
uniform vec3  uColorB;
uniform sampler2D uTex;
uniform float uHasTex;
uniform float uRefract;
uniform float uWallDim;
uniform float uFog;
uniform float uDensity;
uniform float uTrail;

float hash1(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

vec2 hash2(vec2 p){
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return fract(sin(p) * 43758.5453123);
}

vec3 hash3(vec2 p){
  return vec3(hash1(p), hash1(p + 123.45), hash1(p + 678.90));
}

float noise(vec2 p){
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash1(i);
  float b = hash1(i + vec2(1.0, 0.0));
  float c = hash1(i + vec2(0.0, 1.0));
  float d = hash1(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p){
  float v = 0.0;
  float a = 0.5;
  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
  for(int i = 0; i < 5; i++){
    v += a * noise(p);
    p = rot * p * 2.03;
    a *= 0.5;
  }
  return v;
}

void rainDrop(vec2 p, float t, float seed, float speedMul, out float height, out vec2 grad){
  height = 0.0;
  grad = vec2(0.0);
  
  vec2 id = floor(p);
  vec2 f = fract(p) - 0.5;
  
  for(int j = -1; j <= 1; j++){
    for(int i = -1; i <= 1; i++){
      vec2 offset = vec2(float(i), float(j));
      vec3 rnd = hash3(id + offset + seed * 37.3);
      
      float exists = step(0.40 / uDensity, rnd.x);
      
      float size = (0.025 + rnd.y * 0.055) * exists;
      float isBig = step(0.78, rnd.z);
      size = mix(size, 0.075 + rnd.z * 0.085, isBig);
      
      float fallSpeed = (0.15 + rnd.z * 1.5) * speedMul;
      
      float stallPhase = fract(rnd.y * 13.0 + t * 0.20);
      float stall = smoothstep(0.35, 0.55, stallPhase) *
                    (1.0 - smoothstep(0.65, 0.92, stallPhase));
      float speedFactor = mix(1.0, 0.12, stall);
      
      float dropY = fract(rnd.x - t * fallSpeed * speedFactor);
      
      float drift = sin(dropY * 10.0 + rnd.x * 18.0) * 0.055 * (0.4 + rnd.z * 0.8);
      
      vec2 center;
      center.x = offset.x + drift + (rnd.x - 0.5) * 0.85;
      center.y = offset.y + dropY - 0.5;
      
      vec2 d = f - center;
      
      vec2 ds = vec2(d.x, d.y * 1.05);
      float body = exp(-dot(ds, ds) / (size * size)) * exists;
      
      float trail = 0.0;
      if(d.y < 0.0 && uTrail > 0.01){
        float trailLen = (0.12 + rnd.z * 0.28) * uTrail;
        vec2 dt = vec2(d.x * 0.75, d.y * (1.0 / (1.0 + trailLen * 7.0)));
        trail = exp(-dot(dt, dt) / (size * size * 2.0)) * 
                (0.30 + rnd.y * 0.35) * exists * uTrail;
      }
      
      float e = body + trail;
      height += e;
      grad += -e * (2.0 / (size * size)) * ds;
    }
  }
}

vec3 bgColor(vec2 uv){
  float ar = uRes.x / uRes.y;
  vec3 c;
  
  if(uHasTex > 0.5){
    // 图片已在 JS 中预处理为与画布相同的比例，直接采样
    c = texture2D(uTex, vec2(uv.x, 1.0 - uv.y)).rgb;
    
    vec3 mist = vec3(0.58, 0.64, 0.72);
    c = mix(c, mist, uFog * 0.35 + uWallDim * 0.25);
    c *= mix(1.0, 0.70, uWallDim);
  } else {
    float grad = clamp(uv.y * 0.85 + (1.0 - uv.x) * 0.15, 0.0, 1.0);
    c = mix(uColorB, uColorA, grad);
    float glow = smoothstep(1.05, 0.0, length((uv - vec2(0.5, 0.55)) * vec2(ar, 0.9)));
    c += vec3(0.34, 0.40, 0.48) * glow * 0.40;
    c += vec3(0.10, 0.13, 0.18) * smoothstep(0.62, 1.0, uv.y);
    c += (hash1(uv * uRes) - 0.5) * 0.020;
  }
  
  return c;
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  float ar = uRes.x / uRes.y;
  
  vec2 p = vec2(uv.x * ar, uv.y) * 11.0;
  
  float h1, h2;
  vec2 g1, g2;
  
  rainDrop(p * 1.3, uTime * 1.1, 0.0, 1.1, h1, g1);
  rainDrop(p * 0.75 + vec2(5.7, 3.3), uTime * 0.65, 1.0, 0.8, h2, g2);
  
  float h = h1 * 0.55 + h2 * 1.0;
  vec2 g = g1 * 0.55 + g2 * 1.0;
  g = clamp(g, vec2(-18.0), vec2(18.0));
  
  vec3 N = normalize(vec3(-g * 0.04, 1.0));
  
  vec2 off = N.xy * uRefract;
  vec2 lo = vec2(0.002);
  vec2 hi = vec2(0.998);
  
  vec3 col;
  col.r = bgColor(clamp(uv + off * 1.08, lo, hi)).r;
  col.g = bgColor(clamp(uv + off, lo, hi)).g;
  col.b = bgColor(clamp(uv + off * 0.92, lo, hi)).b;
  
  float mist = fbm(uv * 4.0 + vec2(uTime * 0.012, uTime * 0.006));
  vec3 mistColor = vec3(0.62, 0.68, 0.76);
  float wetness = smoothstep(0.08, 0.45, h);
  col = mix(col, mistColor, (uFog * 0.30 + mist * 0.10) * (1.0 - wetness * 0.50));
  
  vec3 L = normalize(vec3(-0.32, 0.62, 0.70));
  float spec = pow(max(dot(N, L), 0.0), 70.0);
  col += vec3(0.94, 0.97, 1.0) * spec * 0.45 * smoothstep(0.10, 0.55, h);
  
  vec3 L2 = normalize(vec3(0.42, 0.52, 0.72));
  float spec2 = pow(max(dot(N, L2), 0.0), 35.0);
  col += vec3(0.85, 0.90, 0.95) * spec2 * 0.20 * smoothstep(0.18, 0.65, h);
  
  float rim = smoothstep(0.04, 0.28, h) * (1.0 - smoothstep(0.28, 0.80, h));
  col -= rim * 0.035;
  
  float edgeFog = smoothstep(0.48, 1.25, length(uv - 0.5) * 1.35);
  col = mix(col, vec3(0.52, 0.58, 0.66), edgeFog * uFog * 0.50 * (1.0 - wetness * 0.40));
  
  float vig = smoothstep(1.35, 0.40, length(uv - 0.5) * 1.50);
  col *= mix(0.82, 1.0, vig);
  
  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(col, vec3(lum), 0.18);
  col *= vec3(0.95, 0.98, 1.05);
  
  gl_FragColor = vec4(col, 1.0);
}
`;

let gl = null, prog = null, U = {}, tex = null, glReady = false;

function compileShader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}

function initGL(){
  try {
    gl = glCanvas.getContext('webgl', {
      antialias: false, alpha: false, depth: false, stencil: false,
      preserveDrawingBuffer: true, premultipliedAlpha: false,
      powerPreference: 'high-performance'
    });
  } catch(e){ gl = null; }

  if (!gl) { console.warn('WebGL 不可用'); return; }

  const vs = compileShader(gl.VERTEX_SHADER, VERT);
  const fs = compileShader(gl.FRAGMENT_SHADER, FRAG);
  prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(prog));
    gl = null; return;
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  U = {
    res: gl.getUniformLocation(prog, 'uRes'),
    time: gl.getUniformLocation(prog, 'uTime'),
    colA: gl.getUniformLocation(prog, 'uColorA'),
    colB: gl.getUniformLocation(prog, 'uColorB'),
    tex: gl.getUniformLocation(prog, 'uTex'),
    hasTex: gl.getUniformLocation(prog, 'uHasTex'),
    refract: gl.getUniformLocation(prog, 'uRefract'),
    wallDim: gl.getUniformLocation(prog, 'uWallDim'),
    fog: gl.getUniformLocation(prog, 'uFog'),
    density: gl.getUniformLocation(prog, 'uDensity'),
    trail: gl.getUniformLocation(prog, 'uTrail')
  };

  tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
                new Uint8Array([10, 14, 20, 255]));
  setTexParams();

  gl.clearColor(0, 0, 0, 1);
  gl.disable(gl.BLEND);
  glReady = true;

  if (state.wallSource){
    uploadTexture(state.wallSource);
    state.hasTex = true;
  }
}

function setTexParams(){
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
}

function uploadTexture(source){
  if (!glReady) return false;
  try {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
    setTexParams();
    return true;
  } catch(err){ console.error('纹理上传失败:', err); return false; }
}

function drawGL(w, h, t){
  if (!glReady) return;
  gl.viewport(0, 0, w, h);
  gl.useProgram(prog);

  const A = hexToRgb01(state.color);
  const B = mixRGB(A, [0.05, 0.07, 0.10], 0.78);

  gl.uniform2f(U.res, w, h);
  gl.uniform1f(U.time, t);
  gl.uniform3f(U.colA, A[0], A[1], A[2]);
  gl.uniform3f(U.colB, B[0], B[1], B[2]);
  gl.uniform1f(U.hasTex, state.hasTex ? 1 : 0);
  gl.uniform1f(U.refract, state.refract);
  gl.uniform1f(U.wallDim, state.wallDim);
  gl.uniform1f(U.fog, state.fog);
  gl.uniform1f(U.density, state.density);
  gl.uniform1f(U.trail, state.trail);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(U.tex, 0);

  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

let paused = false;
let renderScale = 1.0;

function updateCanvasSize(){
  const rect = stage.getBoundingClientRect();
  if (!rect.width || !rect.height) return;

  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  let w = Math.round(rect.width * dpr * renderScale);
  let h = Math.round(rect.height * dpr * renderScale);

  const MAXPIX = 3000 * 3000;
  if (w * h > MAXPIX){
    const s = Math.sqrt(MAXPIX / (w * h));
    w = Math.round(w * s);
    h = Math.round(h * s);
  }

  if (w === glCanvas.width && h === glCanvas.height) return;
  glCanvas.width = w;
  glCanvas.height = h;
}

const t0 = performance.now();
function now(){ return (performance.now() - t0) * 0.001; }

let lastFrameTime = performance.now();
let avgDt = 16.7;
let checkCounter = 0;

function loop(){
  requestAnimationFrame(loop);
  if (paused) { lastFrameTime = performance.now(); return; }

  const t = performance.now();
  const dt = t - lastFrameTime;
  lastFrameTime = t;
  if (dt < 200) avgDt = avgDt * 0.94 + dt * 0.06;

  checkCounter++;
  if (checkCounter >= 60){
    checkCounter = 0;
    let changed = false;
    if (avgDt > 45 && renderScale > 0.70){
      renderScale = Math.max(0.70, renderScale - 0.08);
      changed = true;
    } else if (avgDt < 22 && renderScale < 1.0){
      renderScale = Math.min(1.0, renderScale + 0.04);
      changed = true;
    }
    if (changed) updateCanvasSize();
  }

  drawGL(glCanvas.width, glCanvas.height, now() * state.speed);
}

function maxTextureSize(){
  if (!glReady) return 4096;
  try { return gl.getParameter(gl.MAX_TEXTURE_SIZE) || 4096; }
  catch(e){ return 4096; }
}

// 关键修复：图片预处理为与画布相同的比例（Cover 模式）
function imageToCanvas(img, maxSide, canvasRatio){
  const w = img.naturalWidth || img.width || 1;
  const h = img.naturalHeight || img.height || 1;
  const limit = Math.min(maxSide, maxTextureSize());
  
  let outW, outH;
  if (canvasRatio) {
    // 根据画布比例计算输出尺寸
    if (w / h > canvasRatio) {
      // 图片比画布宽，以高度为基准
      outH = Math.min(h, limit);
      outW = Math.round(outH * canvasRatio);
    } else {
      // 图片比画布窄，以宽度为基准
      outW = Math.min(w, limit);
      outH = Math.round(outW / canvasRatio);
    }
  } else {
    const m = Math.max(w, h);
    const s = m <= limit ? 1 : limit / m;
    outW = Math.round(w * s);
    outH = Math.round(h * s);
  }
  
  const c = document.createElement('canvas');
  c.width = outW;
  c.height = outH;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  
  // Cover 模式绘制：保持图片比例，裁切多余部分
  const imgRatio = w / h;
  let drawW, drawH, drawX, drawY;
  
  if (imgRatio > canvasRatio) {
    // 图片比画布宽，以高度为基准，水平裁切
    drawH = outH;
    drawW = outH * imgRatio;
    drawX = (outW - drawW) / 2;
    drawY = 0;
  } else {
    // 图片比画布窄，以宽度为基准，垂直裁切
    drawW = outW;
    drawH = outW / imgRatio;
    drawX = 0;
    drawY = (outH - drawH) / 2;
  }
  
  ctx.drawImage(img, drawX, drawY, drawW, drawH);
  return c;
}

// 重新处理壁纸（用于比例切换）
function reprocessWallpaper(){
  if (!state.wallSourceOriginal) return;
  
  const canvasRatio = state.ratio === '9:16' ? 9/16 : 1;
  const src = imageToCanvas(state.wallSourceOriginal, 4096, canvasRatio);
  state.wallSource = src;
  
  if (glReady){
    const ok = uploadTexture(src);
    if (ok){
      state.hasTex = true;
    }
  }
}

const PRESETS = ['#8ba8c4','#7d96a8','#a3b8c9','#8899aa','#6b8296','#9bb0c0','#c4d4e0','#5e7286'];

function shade(hex, amount){
  const [r,g,b] = hexToRgb01(hex).map(v => clamp(v + amount, 0, 1));
  return `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
}

function buildSwatches(){
  const wrap = $('#swatches');

    b.style.background = `radial-gradient(circle at 32% 28%, rgba(255,255,255,.85), ${c} 55%, ${shade(c, -0.18)} 100%)`;
    b.dataset.color = c;
    b.addEventListener('click', () => {

      $('#inpColor').value = c;
    });
    wrap.appendChild(b);
  });
}

function setColor(c){

function updateRangeFill(el){
  const min = parseFloat(el.min) || 0;
  const max = parseFloat(el.max) || 1;
  const val = parseFloat(el.value) || 0;
  const pct = ((val - min) / (max - min)) * 100;
  el.style.setProperty('--progress', pct + '%');
}

function setStatus(msg, type){
  const el = $('#uploadStatus');
  el.textContent = msg || '';
  el.className = 'upload-status' + (type ? ' ' + type : '');

// 创建离屏 WebGL 上下文用于导出
function createOffscreenGL(W, H){
  const off = document.createElement('canvas');
  off.width = W;
  off.height = H;
  
  const offGL = off.getContext('webgl', {
    antialias: false, alpha: false, depth: false, stencil: false,
    preserveDrawingBuffer: true, premultipliedAlpha: false
  });

  if (!offGL) return null;

  const vs = offGL.createShader(offGL.VERTEX_SHADER);
  offGL.shaderSource(vs, VERT); offGL.compileShader(vs);
  const fs = offGL.createShader(offGL.FRAGMENT_SHADER);
  offGL.shaderSource(fs, FRAG); offGL.compileShader(fs);
  const p = offGL.createProgram();
  offGL.attachShader(p, vs); offGL.attachShader(p, fs); offGL.linkProgram(p);
  offGL.useProgram(p);

  const buf = offGL.createBuffer();
  offGL.bindBuffer(offGL.ARRAY_BUFFER, buf);
  offGL.bufferData(offGL.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), offGL.STATIC_DRAW);
  const aPos = offGL.getAttribLocation(p, 'aPos');
  offGL.enableVertexAttribArray(aPos);
  offGL.vertexAttribPointer(aPos, 2, offGL.FLOAT, false, 0, 0);

  const uLoc = {
    res: offGL.getUniformLocation(p, 'uRes'),
    time: offGL.getUniformLocation(p, 'uTime'),
    colA: offGL.getUniformLocation(p, 'uColorA'),
    colB: offGL.getUniformLocation(p, 'uColorB'),
    tex: offGL.getUniformLocation(p, 'uTex'),
    hasTex: offGL.getUniformLocation(p, 'uHasTex'),
    refract: offGL.getUniformLocation(p, 'uRefract'),
    wallDim: offGL.getUniformLocation(p, 'uWallDim'),
    fog: offGL.getUniformLocation(p, 'uFog'),
    density: offGL.getUniformLocation(p, 'uDensity'),
    trail: offGL.getUniformLocation(p, 'uTrail')
  };

  const offTex = offGL.createTexture();
  offGL.bindTexture(offGL.TEXTURE_2D, offTex);
  offGL.texParameteri(offGL.TEXTURE_2D, offGL.TEXTURE_WRAP_S, offGL.CLAMP_TO_EDGE);
  offGL.texParameteri(offGL.TEXTURE_2D, offGL.TEXTURE_WRAP_T, offGL.CLAMP_TO_EDGE);
  offGL.texParameteri(offGL.TEXTURE_2D, offGL.TEXTURE_MIN_FILTER, offGL.LINEAR);
  offGL.texParameteri(offGL.TEXTURE_2D, offGL.TEXTURE_MAG_FILTER, offGL.LINEAR);

  if (state.wallSource){
    try {
      offGL.pixelStorei(offGL.UNPACK_FLIP_Y_WEBGL, false);
      offGL.texImage2D(offGL.TEXTURE_2D, 0, offGL.RGBA, offGL.RGBA, offGL.UNSIGNED_BYTE, state.wallSource);
    } catch(e){}
  } else {
    offGL.texImage2D(offGL.TEXTURE_2D, 0, offGL.RGBA, 1, 1, 0, offGL.RGBA, offGL.UNSIGNED_BYTE,
                     new Uint8Array([10, 14, 20, 255]));
  }

  const A = hexToRgb01(state.color);
  const B = mixRGB(A, [0.05, 0.07, 0.10], 0.78);

  function drawOff(t){
    offGL.viewport(0, 0, W, H);
    offGL.useProgram(p);
    offGL.uniform2f(uLoc.res, W, H);
    offGL.uniform1f(uLoc.time, t);
    offGL.uniform3f(uLoc.colA, A[0], A[1], A[2]);
    offGL.uniform3f(uLoc.colB, B[0], B[1], B[2]);
    offGL.uniform1f(uLoc.hasTex, state.hasTex ? 1 : 0);
    offGL.uniform1f(uLoc.refract, state.refract);
    offGL.uniform1f(uLoc.wallDim, state.wallDim);
    offGL.uniform1f(uLoc.fog, state.fog);
    offGL.uniform1f(uLoc.density, state.density);
    offGL.uniform1f(uLoc.trail, state.trail);
    offGL.activeTexture(offGL.TEXTURE0);
    offGL.bindTexture(offGL.TEXTURE_2D, offTex);
    offGL.uniform1i(uLoc.tex, 0);
    offGL.clearColor(0, 0, 0, 1);
    offGL.clear(offGL.COLOR_BUFFER_BIT);
    offGL.drawArrays(offGL.TRIANGLES, 0, 3);
  }

  return { canvas: off, gl: offGL, draw: drawOff };
}

async function exportVideo(fmt){
  isRendering = true;
  downloadBtn.disabled = true;
  btnPreview.disabled = true;
  hidePreview();

  const W = exportRes.w, H = exportRes.h;
  const FPS = 30;
  const totalFrames = Math.round(exportDur * FPS);

  const offCtx = createOffscreenGL(W, H);
  if (!offCtx){
    setProgress(100, 'WebGL 不可用');
    isRendering = false;
    return;
  }

  let mime = 'video/webm;codecs=vp9';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm;codecs=vp8';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';

  const stream = offCtx.canvas.captureStream(30);
  const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12_000_000 });
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };

  const done = new Promise(resolve => {
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: mime });
      resolve(blob);
    };
  });

  recorder.start();
  setProgress(2, '录制中…');

  const frameInterval = 1000 / FPS;
  const startTime = performance.now();

  for (let i = 0; i < totalFrames; i++){
    const t = (i / FPS) * state.speed;
    offCtx.draw(t);
    const pct = 5 + (i / totalFrames) * 85;
    setProgress(pct, `录制帧 ${i+1} / ${totalFrames}`);
    const targetTime = startTime + (i + 1) * frameInterval;
    const wait = targetTime - performance.now();
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    else await new Promise(r => requestAnimationFrame(() => r()));
  }

  recorder.stop();
  const blob = await done;
  stream.getTracks().forEach(t => t.stop());

  setProgress(98, '编码完成');
  await new Promise(r => setTimeout(r, 200));

  isRendering = false;
  return { blob, mime, ext: 'webm' };
}

async function exportGIF(){
  isRendering = true;
  downloadBtn.disabled = true;
  btnPreview.disabled = true;
  hidePreview();

  const W = exportRes.w, H = exportRes.h;
  const FPS = 15;
  const totalFrames = Math.round(exportDur * FPS);
  const frameDelay = Math.round(1000 / FPS);

  const offCtx = createOffscreenGL(W, H);
  if (!offCtx){
    isRendering = false;
    return;
  }

  const gif = new GIF({
    workers: 2,
    quality: 8,
    width: W,
    height: H,
    workerScript: 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js'
  });

  setProgress(2, '捕获帧…');

  for (let i = 0; i < totalFrames; i++){
    const t = (i / FPS) * state.speed;
    offCtx.draw(t);
    gif.addFrame(offCtx.canvas, { copy: true, delay: frameDelay });
    const pct = 5 + (i / totalFrames) * 55;
    setProgress(pct, `捕获帧 ${i+1} / ${totalFrames}`);
    await new Promise(r => setTimeout(r, 10));
  }

  setProgress(62, '编码 GIF…');

  const blob = await new Promise((resolve, reject) => {
    gif.on('progress', p => {
      setProgress(62 + p * 35, `编码 GIF ${Math.round(p*100)}%`);
    });
    gif.on('finished', b => resolve(b));
    gif.on('error', e => reject(e));
    gif.render();
  });

  setProgress(98, '完成');
  await new Promise(r => setTimeout(r, 200));

  isRendering = false;
  return { blob, mime: 'image/gif', ext: 'gif' };
}

async function exportAPNG(){
  isRendering = true;
  downloadBtn.disabled = true;
  btnPreview.disabled = true;
  hidePreview();

  const W = exportRes.w, H = exportRes.h;
  const FPS = 20;
  const totalFrames = Math.round(exportDur * FPS);
  const frameDelay = Math.round(1000 / FPS);

  const offCtx = createOffscreenGL(W, H);
  if (!offCtx){
    isRendering = false;
    return;
  }

  setProgress(2, '捕获帧…');

  const frames = [];
  const delays = [];

  for (let i = 0; i < totalFrames; i++){
    const t = (i / FPS) * state.speed;
    offCtx.draw(t);
    const imgData = offCtx.gl.readPixels(0, 0, W, H, offCtx.gl.RGBA, offCtx.gl.UNSIGNED_BYTE);
    const rgba = new Uint8Array(imgData);
    frames.push(rgba);
    delays.push(frameDelay);
    const pct = 5 + (i / totalFrames) * 60;
    setProgress(pct, `捕获帧 ${i+1} / ${totalFrames}`);
    await new Promise(r => setTimeout(r, 5));
  }

  setProgress(68, '编码 APNG…');
  await new Promise(r => setTimeout(r, 50));

  let blob;
  try {
    const pngBuf = UPNG.encode(frames, W, H, 0, delays);
    blob = new Blob([pngBuf], { type: 'image/png' });
  } catch(e){
    console.error('APNG 编码失败:', e);
    isRendering = false;
    setProgress(100, 'APNG 编码失败');
    return;
  }

  setProgress(98, '完成');
  await new Promise(r => setTimeout(r, 200));

  isRendering = false;
  return { blob, mime: 'image/png', ext: 'png' };
}

async function doExport(){
  if (isRendering) return;
  try {
    let result;
    if (exportFormat === 'webm' || exportFormat === 'mp4'){
      result = await exportVideo(exportFormat);
    } else if (exportFormat === 'gif'){
      result = await exportGIF();
    } else if (exportFormat === 'apng'){
      result = await exportAPNG();
    }

    if (!result) return;

    currentBlob = result.blob;
    if (currentPreviewUrl) URL.revokeObjectURL(currentPreviewUrl);
    currentPreviewUrl = URL.createObjectURL(result.blob);

    const isVideo = exportFormat === 'webm' || exportFormat === 'mp4';
    if (isVideo){
      previewVideo.src = currentPreviewUrl;
      previewVideo.style.display = 'block';
      previewImg.style.display = 'none';
    } else {
      previewImg.src = currentPreviewUrl;
      previewImg.style.display = 'block';
      previewVideo.style.display = 'none';
    }
    previewWrap.classList.add('show');

    downloadBtn.disabled = false;
    btnPreview.disabled = false;
    downloadBtn.dataset.name = `rain-glass-${state.ratio.replace(':','x')}-${exportRes.w}x${exportRes.h}.${result.ext}`;

    hideProgress();
  } catch(err){
    console.error(err);
    isRendering = false;
    setProgress(100, '导出失败：' + (err.message || err));
  }
}

$('#btnPreview').addEventListener('click', () => {
  if (!currentPreviewUrl) return;
  const isVideo = exportFormat === 'webm' || exportFormat === 'mp4';
  if (isVideo){
    previewVideo.play();
  } else {
    window.open(currentPreviewUrl, '_blank');
  }
});

downloadBtn.addEventListener('click', () => {
  if (!currentPreviewUrl || !downloadBtn.dataset.name) return;
  const a = document.createElement('a');
  a.href = currentPreviewUrl;
  a.download = downloadBtn.dataset.name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

$('#startExport').addEventListener('click', doExport);

glCanvas.addEventListener('webglcontextlost', e => { e.preventDefault(); glReady = false; }, false);
glCanvas.addEventListener('webglcontextrestored', () => {
  glReady = false;
  initGL();
  updateCanvasSize();
}, false);

function boot(){
  initGL();
  buildSwatches();

  updateRangeFill(rngSpeed);
  updateRangeFill(rngRefract);
  updateRangeFill(rngFog);
  updateRangeFill(rngWallDim);
  updateRangeFill(rngDensity);
  updateRangeFill(rngTrail);

  updateCanvasSize();
  requestAnimationFrame(loop);
}

let resizeTimer = null;
function scheduleResize(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    updateCanvasSize();
  }, 120);
}
window.addEventListener('resize', scheduleResize);
window.addEventListener('orientationchange', scheduleResize);

if (window.ResizeObserver) new ResizeObserver(scheduleResize).observe(stage);

document.addEventListener('visibilitychange', () => {
  paused = document.hidden;
  if (!paused) lastFrameTime = performance.now();
});

boot();
